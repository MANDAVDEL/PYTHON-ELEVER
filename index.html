<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Python</title>
<style>
:root{color-scheme:dark;--bg:#0f172a;--panel:#111827;--border:#334155;--text:#e5e7eb;--muted:#94a3b8;--accent:#22c55e;--danger:#f87171}
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:20px}
.app{width:min(1000px,100%);margin:auto;display:grid;gap:14px}.top{display:flex;justify-content:space-between;align-items:center}h1{font-size:1.25rem;margin:0}
#status{color:var(--muted);font-size:.9rem}textarea,pre{width:100%;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text)}
textarea{min-height:390px;resize:vertical;padding:16px;outline:none;font:16px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
textarea:focus{border-color:var(--accent)}.actions{display:flex;gap:10px}button{border:0;border-radius:9px;padding:11px 18px;font-weight:700;cursor:pointer}
#run{background:var(--accent);color:#052e16}#run:disabled{opacity:.55;cursor:wait}#clear{background:#334155;color:var(--text)}
.label{font-size:.9rem;color:var(--muted);margin-bottom:-6px}pre{min-height:170px;padding:16px;margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.error{color:var(--danger)}
</style>
</head>
<body>
<main class="app">
  <div class="top"><h1>Python</h1><span id="status">Laddar Python…</span></div>
  <textarea id="code" spellcheck="false" autocomplete="off" autocapitalize="off">namn = input("Vad heter du? ")
print("Hej " + namn + "!")</textarea>
  <div class="actions"><button id="run" disabled>Kör ▶</button><button id="clear">Rensa resultat</button></div>
  <div class="label">Resultat</div>
  <pre id="output"></pre>
</main>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
const codeEl=document.getElementById("code");
const runBtn=document.getElementById("run");
const clearBtn=document.getElementById("clear");
const outputEl=document.getElementById("output");
const statusEl=document.getElementById("status");
let pyodide=null;

function out(text,isError=false){
  outputEl.classList.toggle("error",isError);
  outputEl.textContent += text;
  if(text && !text.endsWith("\n")) outputEl.textContent += "\n";
}
function cleanError(s){
  return String(s)
    .replace(/^PythonError:\s*/,"")
    .replace(/File \"<exec>\".*\n/g,"")
    .replace(/File \"<elevkod>\".*\n/g,"");
}

async function start(){
  try{
    pyodide=await loadPyodide();
    const setup=`
import ast
import js

ALLOWED_MODULES = {"random"}
ALLOWED_FROM_RANDOM = {"randint", "random"}

ALLOWED_BUILTINS = {
    "print": print,
    "range": range,
    "len": len,
    "int": int,
    "float": float,
    "str": str,
    "bool": bool,
    "type": type,
    "round": round,
    "abs": abs,
    "min": min,
    "max": max,
    "sum": sum,
    "pow": pow,
}

def safe_input(prompt=""):
    value = js.prompt(str(prompt))
    if value is None:
        return ""
    return str(value)

def safe_import(name, globals=None, locals=None, fromlist=(), level=0):
    if name != "random":
        raise ImportError(f"Modulen {name} är inte tillåten.")
    import random as _random
    if fromlist:
        for item in fromlist:
            if item not in ALLOWED_FROM_RANDOM:
                raise ImportError(f"{item} får inte importeras från random.")
    return _random

class SafetyVisitor(ast.NodeVisitor):
    def visit_Import(self, node):
        for alias in node.names:
            if alias.name not in ALLOWED_MODULES:
                raise ValueError(f"Import av {alias.name} är inte tillåtet.")
        self.generic_visit(node)

    def visit_ImportFrom(self, node):
        if node.module != "random":
            raise ValueError(f"Import från {node.module} är inte tillåtet.")
        for alias in node.names:
            if alias.name not in ALLOWED_FROM_RANDOM:
                raise ValueError(f"{alias.name} får inte importeras från random.")
        self.generic_visit(node)

    def visit_Attribute(self, node):
        if node.attr.startswith("__"):
            raise ValueError("Dunder-attribut är inte tillåtna.")
        self.generic_visit(node)

    def visit_Name(self, node):
        if node.id.startswith("__"):
            raise ValueError("Dunder-namn är inte tillåtna.")
        self.generic_visit(node)

    def visit_Call(self, node):
        if isinstance(node.func, ast.Name) and node.func.id in {
            "open","exec","eval","compile","globals","locals","vars","dir","help","breakpoint"
        }:
            raise ValueError(f"{node.func.id} är inte tillåtet.")
        self.generic_visit(node)

def run_student_code(source):
    tree = ast.parse(source, mode="exec")
    SafetyVisitor().visit(tree)
    code = compile(tree, "<elevkod>", "exec")
    builtins = dict(ALLOWED_BUILTINS)
    builtins["input"] = safe_input
    builtins["__import__"] = safe_import
    scope = {"__builtins__": builtins}
    exec(code, scope, scope)
`;
    await pyodide.runPythonAsync(setup);
    statusEl.textContent="Redo";
    runBtn.disabled=false;
  }catch(e){
    statusEl.textContent="Kunde inte ladda Python";
    out("Fel vid start: "+cleanError(e),true);
  }
}

runBtn.addEventListener("click",async()=>{
  if(!pyodide)return;
  outputEl.textContent="";
  outputEl.classList.remove("error");
  runBtn.disabled=true;
  statusEl.textContent="Kör…";
  let stdout="",stderr="";
  pyodide.setStdout({batched:s=>{stdout+=s+"\n";}});
  pyodide.setStderr({batched:s=>{stderr+=s+"\n";}});
  try{
    pyodide.globals.set("_student_source",codeEl.value);
    await pyodide.runPythonAsync("run_student_code(_student_source)");
    outputEl.textContent=(stdout+stderr)||"Programmet avslutades utan utskrift.";
  }catch(e){
    outputEl.classList.add("error");
    outputEl.textContent=(stdout+stderr)+cleanError(e);
  }finally{
    try{pyodide.globals.delete("_student_source")}catch(_){}
    statusEl.textContent="Redo";
    runBtn.disabled=false;
  }
});

clearBtn.addEventListener("click",()=>{outputEl.textContent="";outputEl.classList.remove("error")});
codeEl.addEventListener("keydown",e=>{
  if(e.key==="Tab"){
    e.preventDefault();
    const s=codeEl.selectionStart,t=codeEl.selectionEnd;
    codeEl.value=codeEl.value.slice(0,s)+"    "+codeEl.value.slice(t);
    codeEl.selectionStart=codeEl.selectionEnd=s+4;
  }
  if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();runBtn.click()}
});
start();
</script>
</body>
</html>
