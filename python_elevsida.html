<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Python</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --panel: #111827;
      --border: #334155;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #22c55e;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .app {
      width: min(1000px, 100%);
      display: grid;
      gap: 14px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    h1 {
      font-size: 1.25rem;
      margin: 0;
      font-weight: 700;
    }
    #status {
      color: var(--muted);
      font-size: .9rem;
    }
    textarea, pre {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      color: var(--text);
    }
    textarea {
      min-height: 360px;
      resize: vertical;
      padding: 16px;
      font: 16px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      outline: none;
    }
    textarea:focus {
      border-color: var(--accent);
    }
    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    button {
      border: 0;
      border-radius: 9px;
      padding: 11px 18px;
      font-weight: 700;
      cursor: pointer;
    }
    #run {
      background: var(--accent);
      color: #052e16;
    }
    #run:disabled {
      opacity: .55;
      cursor: wait;
    }
    #clear {
      background: #334155;
      color: var(--text);
    }
    .label {
      font-size: .9rem;
      color: var(--muted);
      margin-bottom: -6px;
    }
    pre {
      min-height: 150px;
      padding: 16px;
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: 15px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .error { color: var(--danger); }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <h1>Python</h1>
      <span id="status">Laddar Python…</span>
    </div>

    <textarea id="code" spellcheck="false" autocomplete="off" autocapitalize="off">print("Hej!")
for i in range(5):
    print(i)</textarea>

    <div class="actions">
      <button id="run" disabled>Kör ▶</button>
      <button id="clear">Rensa resultat</button>
    </div>

    <div class="label">Resultat</div>
    <pre id="output"></pre>
  </main>

<script>
(() => {
  const PYODIDE_URL = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js";
  const TIMEOUT_MS = 5000;

  const codeEl = document.getElementById("code");
  const runBtn = document.getElementById("run");
  const clearBtn = document.getElementById("clear");
  const outputEl = document.getElementById("output");
  const statusEl = document.getElementById("status");

  let worker = null;
  let ready = false;
  let runTimer = null;

  function setOutput(text, isError = false) {
    outputEl.textContent = text;
    outputEl.classList.toggle("error", isError);
  }

  function createWorker() {
    if (worker) worker.terminate();

    const workerSource = `
      importScripts(${JSON.stringify(PYODIDE_URL)});

      let pyodide = null;

      async function boot() {
        pyodide = await loadPyodide();

        const guard = String.raw\`
import ast

ALLOWED_BUILTINS = {
    "print": print,
    "range": range,
    "len": len,
    "int": int,
    "float": float,
    "str": str,
    "bool": bool,
    "list": list,
    "dict": dict,
    "set": set,
    "tuple": tuple,
    "enumerate": enumerate,
    "zip": zip,
    "min": min,
    "max": max,
    "sum": sum,
    "abs": abs,
    "round": round,
    "sorted": sorted,
    "reversed": reversed,
    "any": any,
    "all": all,
}

class SafetyVisitor(ast.NodeVisitor):
    def visit_Import(self, node):
        raise ValueError("import är inte tillåtet.")

    def visit_ImportFrom(self, node):
        raise ValueError("import är inte tillåtet.")

    def visit_Attribute(self, node):
        if node.attr.startswith("__"):
            raise ValueError("Dunder-attribut är inte tillåtna.")
        self.generic_visit(node)

    def visit_Name(self, node):
        if node.id.startswith("__"):
            raise ValueError("Dunder-namn är inte tillåtna.")
        self.generic_visit(node)

    def visit_Call(self, node):
        if isinstance(node.func, ast.Name) and node.func.id in {
            "open", "exec", "eval", "compile", "__import__", "globals",
            "locals", "vars", "dir", "help", "input", "breakpoint"
        }:
            raise ValueError(f"{node.func.id} är inte tillåtet.")
        self.generic_visit(node)

def run_student_code(source):
    tree = ast.parse(source, mode="exec")
    SafetyVisitor().visit(tree)
    code = compile(tree, "<elevkod>", "exec")
    scope = {"__builtins__": ALLOWED_BUILTINS}
    exec(code, scope, scope)
\`;

        await pyodide.runPythonAsync(guard);
        postMessage({type: "ready"});
      }

      boot().catch(err => postMessage({type: "boot-error", error: String(err)}));

      onmessage = async (event) => {
        if (!pyodide || event.data?.type !== "run") return;

        let stdout = "";
        let stderr = "";

        pyodide.setStdout({batched: s => { stdout += s + "\\n"; }});
        pyodide.setStderr({batched: s => { stderr += s + "\\n"; }});

        try {
          pyodide.globals.set("_student_source", event.data.code);
          await pyodide.runPythonAsync("run_student_code(_student_source)");
          postMessage({type: "result", stdout, stderr});
        } catch (err) {
          postMessage({
            type: "error",
            stdout,
            stderr,
            error: String(err)
              .replace(/^PythonError:\\s*/, "")
              .replace(/File "<exec>".*\\n/g, "")
          });
        } finally {
          try { pyodide.globals.delete("_student_source"); } catch (_) {}
        }
      };
    `;

    const blob = new Blob([workerSource], {type: "text/javascript"});
    worker = new Worker(URL.createObjectURL(blob));

    ready = false;
    runBtn.disabled = true;
    statusEl.textContent = "Laddar Python…";

    worker.onmessage = (event) => {
      const msg = event.data;

      if (msg.type === "ready") {
        ready = true;
        runBtn.disabled = false;
        statusEl.textContent = "Redo";
        return;
      }

      if (msg.type === "boot-error") {
        statusEl.textContent = "Kunde inte ladda Python";
        setOutput("Fel vid start: " + msg.error, true);
        return;
      }

      if (msg.type === "result") {
        clearTimeout(runTimer);
        runBtn.disabled = false;
        const text = (msg.stdout || "") + (msg.stderr || "");
        setOutput(text || "Programmet avslutades utan utskrift.");
        return;
      }

      if (msg.type === "error") {
        clearTimeout(runTimer);
        runBtn.disabled = false;
        const text = (msg.stdout || "") + (msg.stderr || "") + (msg.error || "Okänt fel");
        setOutput(text, true);
      }
    };
  }

  function runCode() {
    if (!ready) return;

    const code = codeEl.value;
    if (code.length > 20000) {
      setOutput("Koden är för lång.", true);
      return;
    }

    setOutput("");
    runBtn.disabled = true;
    statusEl.textContent = "Kör…";

    worker.postMessage({type: "run", code});

    clearTimeout(runTimer);
    runTimer = setTimeout(() => {
      setOutput("Programmet stoppades eftersom det körde längre än 5 sekunder.", true);
      statusEl.textContent = "Startar om…";
      createWorker();
    }, TIMEOUT_MS);
  }

  runBtn.addEventListener("click", runCode);
  clearBtn.addEventListener("click", () => setOutput(""));

  codeEl.addEventListener("keydown", (event) => {
    if (event.key === "Tab") {
      event.preventDefault();
      const start = codeEl.selectionStart;
      const end = codeEl.selectionEnd;
      codeEl.value = codeEl.value.slice(0, start) + "    " + codeEl.value.slice(end);
      codeEl.selectionStart = codeEl.selectionEnd = start + 4;
    }

    if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
      event.preventDefault();
      runCode();
    }
  });

  createWorker();
})();
</script>
</body>
</html>
